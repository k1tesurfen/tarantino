[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tarantino"
version = "0.1.0"
description = "Home cinema infrastructure: programme engine, cinema & admin websites, projector control."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.1",
    "alembic==1.20.0",
    "httpx==0.28.1",
    "apscheduler==3.11.3",
    "typer==0.27.2",
    "pychromecast==14.0.10",
    "androidtvremote2==0.3.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
tarantino = "tarantino.cli:app"

[tool.setuptools.packages.find]
include = ["tarantino*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
